<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attack Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-grid"></div>

  <div class="container">

<header class="header">
  <div class="header-tag">N3xus // v0.1</div>

  <h1 class="wave">
    <span class="word up" data-text="N3xus"></span>
    <span class="word down" data-text="attack"></span>
  </h1>

  <img src="logo.jpg" class="logo" alt="Logo" />
</header>

    <div class="card" id="status-card">
      <div class="card-label">CONNECTION STATUS</div>
      <div id="status"><span class="dot dot--idle"></span> Checking...</div>
    </div>

    <div class="card">
      <div class="card-label">PAIR WHATSAPP</div>
      <div class="field-group">
        <input type="text" id="pair-phone" placeholder="Phone number (e.g. 628123456789)" autocomplete="off" />
        <div class="btn-row">
          <button id="pairBtn" class="btn btn--primary">Pair Device</button>
          <button id="resetBtn" class="btn btn--danger">Reset</button>
        </div>
      </div>
      <div id="pairCode"></div>
    </div>

    <div class="card">
      <div class="card-label">SEND BUG</div>
      <div class="field-group">
        <input type="text" id="target" placeholder="Target number (e.g. 628123456789)" autocomplete="off" />
        <div class="select-wrapper">
          <select id="bug-type">
            <option value="Crash Infinity">Crash Infinity</option>
            <option value="Blank Freeze">Blank Freeze</option>
            <option value="Lag Flood">Lag Flood</option>
          </select>
          <span class="select-arrow">▾</span>
        </div>
        <button id="sendBtn" class="btn btn--primary btn--full">▶ SEND BUG</button>
      </div>
    </div>

    <footer class="footer">UNAUTHORIZED ACCESS IS PROHIBITED</footer>
  </div>

  <script src="admin.js"></script>
</body>
</html>
